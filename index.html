<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El compañerismo | Miguel & Aleska</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤝</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;font-family:Nunito,Arial,sans-serif;font-weight:800}
#stage{height:100%;width:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:4vh 6vw;font-size:clamp(20px,2.6vw,44px);transition:background .35s,color .35s;cursor:pointer}
h1,h2,h3,.big,.o,.name{font-family:'Lilita One',Impact,sans-serif;font-weight:400}
h1{font-size:clamp(60px,12vw,200px);line-height:.95;margin:0}
h2{font-size:clamp(34px,5.6vw,92px);line-height:1.05;margin:0 0 3vh}
p{margin:2vh auto;max-width:22em}
small{display:block;font-size:.6em;opacity:.75;margin-bottom:2vh}
.t-indigo{background:#2b1b6b;color:#fff}.t-yel{background:#ffd23f;color:#1a0f45}.t-pink{background:#ff4f9a;color:#fff}
.t-cyan{background:#3de0e8;color:#1a0f45}.t-green{background:#3ddc84;color:#102a1a}.t-dark{background:#1a0f45;color:#fff}
.inner{width:100%;max-width:1400px}
.emoji{font-size:2.6em;line-height:1}
.pill{display:inline-block;border-radius:99px;padding:.15em .8em;margin:0 .3em;font-family:'Lilita One',sans-serif}
.pill.a{background:#ff4f9a;color:#fff}.pill.b{background:#3de0e8;color:#1a0f45}
.bob{display:inline-block;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-1.5vh) rotate(-2deg)}}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:2vh 2vw;text-align:left;margin-top:2vh}
.o{border-radius:18px;padding:.7em 1em;display:flex;gap:.6em;align-items:center;font-size:1em;border:5px solid transparent}
.o b{background:rgba(0,0,0,.25);border-radius:10px;padding:0 .5em}
.c0{background:#ff4f9a}.c1{background:#3de0e8;color:#1a0f45}.c2{background:#ffd23f;color:#1a0f45}.c3{background:#3ddc84;color:#102a1a}
.o.dim{opacity:.25}.o.ok{border-color:#fff;transform:scale(1.04)}
.tm{margin:3vh auto 0;display:flex;align-items:center;gap:1.2vw;max-width:900px}
.tm div{flex:1;height:22px;background:#3d2a8f;border-radius:99px;overflow:hidden}
.tm i{display:block;height:100%;width:100%;background:#3de0e8;transition:width 1s linear}
.tm i.low{background:#ff4f9a}.tm span{font-family:'Lilita One',sans-serif;font-size:1.6em;min-width:1.5em}
.ans{font-family:'Lilita One',sans-serif;font-size:1.3em;color:#3ddc84;margin-top:2vh}
.phrase{font-family:'Lilita One',sans-serif;font-size:clamp(40px,7vw,120px);line-height:1.1}
.name{font-size:clamp(44px,8vw,130px);color:#ffd23f;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.2);opacity:0}}
.big{font-size:clamp(100px,24vw,380px);line-height:1;color:#ffd23f}
.hint{position:fixed;right:20px;bottom:14px;font-size:16px;opacity:.55;pointer-events:none}
#prog{position:fixed;left:0;top:0;height:6px;background:#ff4f9a;transition:width .3s;z-index:5}
.confetti{position:fixed;top:-30px;font-size:34px;pointer-events:none;animation:fall 2.6s linear forwards;z-index:9}
@keyframes fall{to{transform:translateY(112vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:700px){.opts{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="prog"></div>
<div id="stage" class="t-indigo"></div>
<div class="hint">← atrás &nbsp; → / Espacio adelante &nbsp; F pantalla completa</div>

<script>
/* =========================================================
   CONFIGURACIÓN: edita solo esta parte
   ========================================================= */
const CONFIG={
  titulo:'El compañerismo',
  expositores:['Miguel','Aleska'],
  segundos:15,        // tiempo por pregunta del quiz
  patioMin:5,         // minutos de la cuenta regresiva al patio
  picoPark:false,     // se activará en el paso 3

  // Frases de "¿Quién es quién?". Copia una línea para agregar más.
  frases:[
    {f:'Ya perdí, ya perdí',n:'Yamir Arteaga'},
    // {f:'Escribe aquí la frase',n:'Nombre y apellido'},
  ],

  // Preguntas del quiz. c = número de la opción correcta (0 = A, 1 = B, 2 = C, 3 = D)
  preguntas:[
    {q:'¿Qué es el compañerismo?',o:['Competir contra todos','Apoyo y respeto entre compañeros','Copiar la tarea','Ignorar al resto'],c:1},
    {q:'Un compañero se cae en el recreo. ¿Qué haces?',o:['Me río','Sigo jugando','Lo ayudo a levantarse','Lo grabo'],c:2},
    {q:'Ponerte en el lugar del otro se llama…',o:['Empatía','Suerte','Chisme','Orgullo'],c:0},
    {q:'¿Cuál es un acto de lealtad?',o:['Hablar mal a sus espaldas','No dejarlo solo cuando te necesita','Contar sus secretos','Cambiar de grupo'],c:1},
    {q:'Alguien piensa distinto a ti. Lo respetas si…',o:['Lo escuchas','Lo callas','Te burlas','Lo ignoras'],c:0},
    {q:'En un trabajo en equipo, uno se queda atrás. Lo mejor es…',o:['Que se arregle solo','Ayudarlo a llegar','Dejarlo','Culparlo'],c:1},
    {q:'¿Qué valor es dar una mano sin que te la pidan?',o:['Ayuda','Orgullo','Pereza','Envidia'],c:0},
    {q:'Un buen compañero también es el que…',o:['Se burla del error','Guarda secretos y no humilla','Se queda con todo','Habla más fuerte'],c:1}
  ]
};

/* ===== utilidades ===== */
const $=id=>document.getElementById(id);
let ac;
function beep(f,d=.15,t='square',v=.07){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
const good=()=>{beep(660,.1);setTimeout(()=>beep(990,.22),110)};
const buzz=()=>beep(150,.4,'sawtooth');
function confetti(){const e=['🎉','🤝','⭐','🔥','💛','✨'];for(let i=0;i<28;i++){const c=document.createElement('div');c.className='confetti';c.textContent=e[i%6];c.style.left=Math.random()*100+'vw';c.style.animationDelay=Math.random()*.7+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),3500)}}
let T;

/* ===== cuenta regresiva (quiz) ===== */
function timer(s){let t=s;const b=$('tb'),n=$('tn');
  const up=()=>{n.textContent=t;b.style.width=(t/s*100)+'%';b.classList.toggle('low',t<=5)};up();
  T=setInterval(()=>{t--;up();if(t>0&&t<=5)beep(440,.08);if(t<=0){clearInterval(T);buzz()}},1000)}

/* ===== secuencia de pantallas ===== */
const F=[];
const add=(theme,html,enter)=>F.push({theme,html,enter});
const box=h=>`<div class="inner">${h}</div>`;

// 1. Inicio
add('indigo',box(`<h1><span class="bob">${CONFIG.titulo}</span></h1><p><span class="pill a">${CONFIG.expositores[0]}</span><span class="pill b">${CONFIG.expositores[1]}</span></p><p>Gracias por elegirnos los mejores amigos del salón. Hoy les toca jugar.</p>`),()=>{good();confetti()});

// 2. Exposición
add('yel',box(`<div class="emoji">🤝</div><h2>¿Qué es el compañerismo?</h2><p>Es la unión entre personas que comparten un lugar y un objetivo. Se nota en cómo nos tratamos cuando nadie nos mira.</p>`));
add('indigo',box(`<h2>4 valores que lo sostienen</h2><div class="emoji">🧱</div><p>Uno por uno.</p>`));
[['pink','🫶','Respeto','Escuchar aunque pensemos distinto.'],
 ['cyan','🙌','Ayuda','Dar una mano sin que la pidan.'],
 ['green','🛡️','Lealtad','Estar en las buenas y en las malas.'],
 ['yel','👟','Empatía','Ponerte en el lugar del otro.']
].forEach(v=>add(v[0],box(`<div class="emoji">${v[1]}</div><h2>${v[2]}</h2><p>${v[3]}</p>`),()=>beep(520+Math.random()*200,.12)));
add('dark',box(`<h2>Sin compañerismo no se gana</h2><p>Si uno se queda atrás, nadie pasa. Ahora vamos a comprobarlo.</p><div class="emoji">🎮</div>`));

// 3. Quiz
add('indigo',box(`<div class="emoji">⚡</div><h2>Quiz del compañerismo</h2><p>${CONFIG.preguntas.length} preguntas, ${CONFIG.segundos} segundos cada una. Levanten la mano para responder.</p>`),()=>good());
CONFIG.preguntas.forEach((p,i)=>{
  const head=`<small>Pregunta ${i+1} de ${CONFIG.preguntas.length}</small><h2>${p.q}</h2>`;
  const opts=r=>`<div class="opts">${p.o.map((o,j)=>`<div class="o c${j}${r?(j===p.c?' ok':' dim'):''}"><b>${'ABCD'[j]}</b>${o}</div>`).join('')}</div>`;
  add('dark',box(head+opts(0)+`<div class="tm"><div><i id="tb"></i></div><span id="tn"></span></div>`),()=>timer(CONFIG.segundos));
  add('dark',box(head+opts(1)+`<div class="ans">✅ ${'ABCD'[p.c]}: ${p.o[p.c]}</div>`),()=>good());
});

// 4. ¿Quién es quién?
if(CONFIG.frases.length){
  add('pink',box(`<div class="emoji">🕵️</div><h2>¿Quién es quién?</h2><p>Leemos una frase. Adivinen quién la diría.</p>`),()=>good());
  CONFIG.frases.forEach(x=>{
    add('indigo',box(`<small>¿Quién lo diría?</small><div class="phrase">“${x.f}”</div>`),()=>beep(300,.15));
    add('indigo',box(`<small>¿Quién lo diría?</small><div class="phrase">“${x.f}”</div><div class="name" style="margin-top:3vh">${x.n}</div>`),()=>{good();confetti()});
  });
}

// 5. Pico Park (se activa en el paso 3)
if(CONFIG.picoPark)add('dark',box(`<h2>Pico Park</h2><p>Pronto.</p>`));

// 6. Final y patio
add('yel',box(`<div class="emoji">🍬</div><h2>Gracias por jugar</h2><p>Antes de salir, pasen por sus chucheras. En orden, uno por uno.</p>`),()=>{good();confetti()});
add('green',box(`<h2>¡Al patio!</h2><div class="big" id="cd"></div><p>Aleska dirige. Salgan sin correr.</p>`),()=>{
  let s=CONFIG.patioMin*60;const show=()=>{$('cd').textContent=s>0?String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'):'¡YA!'};
  show();T=setInterval(()=>{s--;show();if(s<=0){clearInterval(T);buzz();confetti()}},1000)});

/* ===== navegación ===== */
let i=0;
function show(n){clearInterval(T);i=Math.max(0,Math.min(F.length-1,n));const f=F[i],st=$('stage');
  st.className='t-'+f.theme;st.innerHTML=f.html;$('prog').style.width=((i+1)/F.length*100)+'%';
  if(f.enter)f.enter()}
const next=()=>show(i+1),prev=()=>show(i-1);
addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown','Enter'].includes(e.key)){e.preventDefault();next()}
  else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){e.preventDefault();prev()}
  else if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}
  else if(e.key==='Home')show(0);
});
$('stage').addEventListener('click',next);
show(0);
</script>
</body>
</html>
